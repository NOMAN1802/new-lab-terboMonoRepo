name: Deploy (Vercel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: [server, client]
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Select project
        run: |
          if [ "${{ matrix.app }}" = "server" ]; then
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_SERVER_PROJECT_ID }}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_CLIENT_PROJECT_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel environment (production)
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel environment (preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build (production)
        if: github.event_name == 'push'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build (preview)
        if: github.event_name == 'pull_request'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app }}: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-${{ matrix.app }}
          message: "Preview (${{ matrix.app }}): ${{ steps.deploy.outputs.url }}"
