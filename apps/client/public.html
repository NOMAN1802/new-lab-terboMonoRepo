<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your reports · New Lab Diagnostic & Consultation Centre</title>
    <style>
      /* Painted before a byte of JavaScript arrives. A patient on slow mobile
         data would otherwise sit in front of an empty page and conclude the
         link is broken -- which is exactly what happened. React replaces this
         the moment it mounts. */
      body { margin: 0; background: #EFEBE3; }
      .boot {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        color: #57534B; padding: 24px; text-align: center;
      }
      .boot__ring {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid #C9C3B6; border-top-color: #1A1815;
        animation: boot-spin .9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot__ring { animation: none; } }
      .boot__note { font-size: 12px; color: #7A756B; max-width: 22rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot__ring"></div>
        <p>Loading your reports…</p>
        <p class="boot__note">This can take a few moments on a slow connection.</p>
      </div>
    </div>
    <script type="module" src="/src/public-main.tsx"></script>
  </body>
</html>
